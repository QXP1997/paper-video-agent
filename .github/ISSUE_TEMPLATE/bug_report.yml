name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。安全漏洞请通过 Security 页面私密报告，不要填写此表单。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你预期发生什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行命令……
        2. 使用配置……
        3. 出现错误……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 项目版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows 11 / Python 3.12 / FFmpeg 8.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 请移除 API Key、路径中的个人信息和受版权保护的论文内容。
      render: shell

