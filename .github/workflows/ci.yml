name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/qharness/pyproject.toml

      - name: Install QHarness and project
        run: |
          python -m pip install -e ./packages/qharness
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          DEEPSEEK_API_KEY: test-key
        run: pytest --cov=paper_video_agent --cov-report=term-missing

  qharness-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/qharness

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: packages/qharness/pyproject.toml

      - name: Install QHarness
        run: python -m pip install -e .

      - name: Test QHarness
        run: python -m unittest discover -s tests
