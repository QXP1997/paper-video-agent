[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-video-agent"
version = "0.2.0"
description = "Turn research-paper PDFs into evidence-aware Chinese explainer videos."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["paper", "pdf", "video", "tts", "deepseek"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "edge-tts>=7.0,<8.0",
    "httpx>=0.27,<1.0",
    "langchain-core>=1.1,<2.0",
    "langchain-deepseek>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "PyMuPDF>=1.26,<2.0",
]

[project.urls]
Homepage = "https://github.com/QXP1997/research-agent-workbench"
Repository = "https://github.com/QXP1997/research-agent-workbench"
Issues = "https://github.com/QXP1997/research-agent-workbench/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
paper-video = "paper_video_agent.paper2video:main"
paper-video-metadata = "paper_video_agent.social_metadata:main"
research-deck = "research_presentation_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
presentation_agent = [
    "skills/create-research-deck/SKILL.md",
    "skills/create-research-deck/agents/openai.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["paper", "packages/qharness"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
